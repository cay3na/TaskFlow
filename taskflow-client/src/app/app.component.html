<!-- The toolbar only shows when the user is logged in -->
<mat-toolbar color="primary" *ngIf="authService.isLoggedIn()">
  <mat-icon> sentiment_satisfied_alt</mat-icon>
  <span style="margin-left: 8px; font-weight: 500;">TaskFlow</span>
  <span class="spacer"></span>
  <span style="margin-right: 16px; font-size: 14px;">
    {{ authService.currentUser()?.name }}
  </span>
  <button mat-icon-button (click)="logout()" title="Logout">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<!-- RouterOutlet renders the current route's component here -->
<router-outlet></router-outlet>
