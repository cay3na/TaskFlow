<div class="auth-container">

  <mat-card class="auth-card">

    <mat-card-header class="login-header">

      <mat-card-title>Sign in to TaskFlow</mat-card-title>

    </mat-card-header>

    <mat-card-content>

      <!-- [formGroup] binds this HTML form to our reactive form object -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="full-width">

          <mat-label>Email</mat-label>

          <!-- formControlName links this input to the "email" form control -->
          <input matInput type="email" formControlName="email" placeholder="name@example.com">
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Enter a valid email</mat-error>

        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">

          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>

        </mat-form-field>

        <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || loading" class="full-width submit-btn">

          <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>

          <span *ngIf="!loading">Sign In</span>

        </button>

      </form>

    </mat-card-content>

    <mat-card-footer>

      <p class="footer-text">

        Don't have an account? <a routerLink="/register">Create one</a>

      </p>

    </mat-card-footer>

  </mat-card>
  
</div>
