
<div class="auth-container">

  <mat-card class="auth-card">

    <mat-card-header class="register-header">

      <mat-card-title>Create your account</mat-card-title>

    </mat-card-header>

    <mat-card-content>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="full-width">

          <mat-label>Full Name</mat-label>

          <input matInput formControlName="name" placeholder="Name Surname">

          <mat-error *ngIf="registerForm.get('name')?.hasError('required')">Name is required</mat-error>

        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">

          <mat-label>Email</mat-label>

          <input matInput type="email" formControlName="email">

          <mat-error *ngIf="registerForm.get('email')?.hasError('email')">Enter a valid email</mat-error>

          <mat-error *ngIf="registerForm.get('email')?.hasError('required')">Email is required</mat-error>

        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">

          <mat-label>Password</mat-label>

          <input matInput type="password" formControlName="password">

          <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">At least 6 characters</mat-error>

          <mat-error *ngIf="registerForm.get('password')?.hasError('required')">Password is required</mat-error>

        </mat-form-field>

        <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button mat-raised-button color="primary" type="submit"
                [disabled]="registerForm.invalid || loading" class="full-width submit-btn">

          <span *ngIf="!loading">Create Account</span>

          <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>

        </button>

      </form>

    </mat-card-content>

    <mat-card-footer>

      <p class="footer-text">Already have an account? <a routerLink="/login">Sign in</a></p>
    </mat-card-footer>

  </mat-card>

</div>
